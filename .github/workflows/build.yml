name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # publish GitHub Releases for v* tags

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for naming branch builds after the latest release

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            # e.g. 0.1.0-ci.7: ranks above release 0.1.0 and below 0.1.1 (the build derives the version code)
            BASE=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null | sed 's/^v//')
            NAME="${BASE:-0.0.0}-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Refuse to publish a debug-signed release
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE != 'true'
        run: |
          echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing; a tagged release must be signed with the release key."
          exit 1

      - name: Release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ORG_GRADLE_PROJECT_hyperdeskReleaseStoreFile=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ORG_GRADLE_PROJECT_hyperdeskReleaseStorePassword: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_hyperdeskReleaseKeyAlias: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_hyperdeskReleaseKeyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon -PappVersionName=${{ steps.ver.outputs.name }}

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "hyperdesk-${{ steps.ver.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: hyperdesk-${{ steps.ver.outputs.name }}
          path: hyperdesk-*.apk

      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.ver.outputs.name }}
        run: |
          APK="hyperdesk-${VERSION}.apk"
          sha256sum "$APK" > "$APK.sha256"
          # Section between "## [VERSION]" and the next "## [" heading.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { next }
            on { print }
          ' CHANGELOG.md > section.md
          if [ ! -s section.md ]; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section"
            exit 1
          fi
          {
            cat section.md
            echo
            echo "### Install"
            echo
            echo "Download **${APK}** on the phone and open it to install (allow installs from your browser or file manager when asked),"
            echo "then open **HyperDesk** and follow the setup guide. No computer is needed."
            echo
            echo "Needs a Xiaomi phone on HyperOS 3 (Android 16) with video output over USB-C, and Wi-Fi for setup."
            echo "SHA-256: \`$(cut -d' ' -f1 "$APK.sha256")\`"
          } > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: HyperDesk ${{ steps.ver.outputs.name }}
          body_path: release-notes.md
          files: |
            hyperdesk-*.apk
            hyperdesk-*.apk.sha256
